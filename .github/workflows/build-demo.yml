name: build-demo

# Builds the demo app against the bindings packed from this branch. The macOS job is the iOS smoke
# test for the whole repository: the curated ApiDefinitions.cs, the three xcframeworks and the wrapper's
# iOS partial only meet the real toolchain (clang linking, framework embedding) here.

on:
  pull_request:
  push:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SDK_VERSION: 10.0.102
  BUILD_CONFIGURATION: Release
  DEMO_PROJECT: demo/DemoApp/DemoApp/DemoApp.csproj

jobs:
  android:
    name: Demo Android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Create global.json to specify .NET version
        run: |
          echo '{"sdk":{"version":"${{ env.DOTNET_SDK_VERSION }}"}}' > ${{ github.workspace }}/global.json

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI workloads
        run: dotnet workload install maui-android maui-ios maui-maccatalyst maui-windows --ignore-failed-sources --version ${{ env.DOTNET_SDK_VERSION }}

      - name: Pack bindings into the local feed
        # build + pack --no-build rather than a bare pack: see unit-tests.yml (NU5026 with GeneratePackageOnBuild).
        run: |
          dotnet build src/Maui.Facebook.Core.Android/Maui.Facebook.Core.Android.csproj -c ${{ env.BUILD_CONFIGURATION }}
          dotnet pack  src/Maui.Facebook.Core.Android/Maui.Facebook.Core.Android.csproj -c ${{ env.BUILD_CONFIGURATION }} --no-build -o local-nuget
          dotnet build src/Maui.Facebook.Core.iOS/Maui.Facebook.Core.iOS.csproj -c ${{ env.BUILD_CONFIGURATION }}
          dotnet pack  src/Maui.Facebook.Core.iOS/Maui.Facebook.Core.iOS.csproj -c ${{ env.BUILD_CONFIGURATION }} --no-build -o local-nuget

      - name: Build demo (android-x64, self-contained)
        # EmbedAssembliesIntoApk makes the APK installable with plain `adb install`, which is how the
        # harness is driven on a device or emulator (see README "Demo and on-device harness").
        run: >
          dotnet build ${{ env.DEMO_PROJECT }}
          -c ${{ env.BUILD_CONFIGURATION }}
          -f net10.0-android
          -p:RuntimeIdentifier=android-x64
          -p:EmbedAssembliesIntoApk=true

      - uses: actions/upload-artifact@v4
        with:
          name: demo-android-apk
          path: demo/DemoApp/DemoApp/bin/${{ env.BUILD_CONFIGURATION }}/net10.0-android/android-x64/*-Signed.apk
          if-no-files-found: error

  ios:
    name: Demo iOS (simulator)
    runs-on: macos-15
    env:
      #https://github.com/actions/runner-images/tree/main/images/macos
      XCODE_VERSION: 16.4
    steps:
      - name: Set Xcode Version
        run: |
          if [[ -d /Applications/Xcode_${{ env.XCODE_VERSION }}.app ]]; then
            sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app
          fi
          xcodebuild -version

      - uses: actions/checkout@v4

      - name: Create global.json to specify .NET version
        run: |
          echo '{"sdk":{"version":"${{ env.DOTNET_SDK_VERSION }}"}}' > ${{ github.workspace }}/global.json

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI workloads
        run: dotnet workload install ios maui-ios maui-maccatalyst maui-android --ignore-failed-sources --version ${{ env.DOTNET_SDK_VERSION }}

      - name: Pack iOS binding into the local feed
        # build + pack --no-build rather than a bare pack: see unit-tests.yml (NU5026 with GeneratePackageOnBuild).
        run: |
          dotnet build src/Maui.Facebook.Core.iOS/Maui.Facebook.Core.iOS.csproj -c ${{ env.BUILD_CONFIGURATION }}
          dotnet pack  src/Maui.Facebook.Core.iOS/Maui.Facebook.Core.iOS.csproj -c ${{ env.BUILD_CONFIGURATION }} --no-build -o local-nuget

      - name: Pack Android binding into the local feed
        # The wrapper's restore evaluates its Android TFM too, so the Android binding version referenced
        # by this branch has to be resolvable even on the iOS job.
        run: |
          dotnet build src/Maui.Facebook.Core.Android/Maui.Facebook.Core.Android.csproj -c ${{ env.BUILD_CONFIGURATION }}
          dotnet pack  src/Maui.Facebook.Core.Android/Maui.Facebook.Core.Android.csproj -c ${{ env.BUILD_CONFIGURATION }} --no-build -o local-nuget

      - name: Build demo (iOS simulator)
        # Links the app against all three xcframeworks - the step that would catch a wrong selector, a
        # missing framework dependency or a broken slice, none of which the Windows pack can see.
        run: >
          dotnet build ${{ env.DEMO_PROJECT }}
          -c ${{ env.BUILD_CONFIGURATION }}
          -f net10.0-ios
          -p:RuntimeIdentifier=iossimulator-arm64
